<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f11;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #0f0f11;
      border-right: 1px solid #1f1f22;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: #a0a0a5;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      border: none;
      background: transparent;
      text-align: left;
      font-family: inherit;
    }

    .nav-item:hover, .nav-item.active {
      background: #1f1f22;
      color: #ffffff;
    }

    .sidebar-section {
      margin-top: 24px;
    }

    .section-title {
      font-size: 11px;
      color: #64646a;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0 12px;
      margin-bottom: 8px;
    }

    .history-item {
      font-size: 13px;
      color: #a0a0a5;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #1f1f22;
      color: #ffffff;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0c;
      position: relative;
    }

    .top-nav {
      height: 50px;
      border-bottom: 1px solid #1f1f22;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .tab {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Chat Area */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 10%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      scroll-behavior: smooth;
    }

    /* Empty State / Inspiration Match */
    .empty-state {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .orbit-title {
      font-family: 'Cinzel', serif;
      font-size: 80px;
      font-weight: 700;
      color: #e8e8e8;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }

    .orbit-subtitle {
      font-size: 15px;
      color: #8a8a93;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Messages */
    .msg {
      max-width: 800px;
      font-size: 15px;
      line-height: 1.6;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: #1f1f22;
      padding: 16px 20px;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      color: #ffffff;
      max-width: 70%;
    }

    .msg.bot {
      align-self: flex-start;
      color: #d1d1d6;
      padding: 16px 0;
      max-width: 100%;
    }

    .msg.bot .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #2a2a2e;
    }

    .badge.known   { background: transparent; color: #a0a0a5; }
    .badge.spawned { background: #231b2e; border-color: #3b2d4d; color: #c084fc; }
    .badge.error   { background: #3f1515; border-color: #5c1e1e; color: #f87171; }

    .msg.loading {
      color: #64646a;
      font-style: italic;
    }

    .result-text { white-space: pre-wrap; }

    /* Input Area */
    .input-container {
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    #input-area {
      width: 100%;
      max-width: 750px;
      background: #141416;
      border: 1px solid #26262b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 12px;
      transition: border-color 0.2s, background 0.2s;
    }

    #input-area:focus-within {
      border-color: #3f3f46;
      background: #1a1a1c;
    }

    .plus-icon {
      color: #64646a;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      padding: 10px 0;
      font-family: inherit;
    }

    #user-input::placeholder {
      color: #5a5a60;
    }

    #send-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { opacity: 0.8; }
    #send-btn:disabled { background: #3f3f46; color: #8a8a93; cursor: not-allowed; }

    #send-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Model bar */
    .model-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 0 2px;
    }

    .model-chip {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #a0a0a5;
      background: #16161a;
      border: 1px solid #26262b;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .model-select {
      font-family: inherit;
      font-size: 12.5px;
      color: #d1d1d6;
      background: #16161a;
      border: 1px solid #26262b;
      border-radius: 20px;
      padding: 4px 12px;
      max-width: 320px;
      outline: none;
      cursor: pointer;
    }

    .model-select:hover { border-color: #3a3a42; }

    .model-tag {
      font-size: 11px;
      color: #6a6a72;
      margin-left: 8px;
      font-weight: 400;
    }

    /* Hide empty state when chatting */
    .chat-active .empty-state {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        New session
      </button>
      <button class="nav-item">Capabilities</button>
      <button class="nav-item">Messaging</button>
      <button class="nav-item">Artifacts</button>
    </div>

    <div class="sidebar-section">
      <div class="section-title">PINNED</div>
      <div class="history-item">Hey, today I want to start...</div>
    </div>

    <div class="sidebar-section">
      <div class="section-title">SESSIONS</div>
      <div class="history-item">hackathon prep</div>
      <div class="history-item">Untitled session</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-nav">
      <div class="tab">○ NEW SESSION</div>
    </div>
    
    <div id="chat-area">
       <!-- Empty State (Orbit Title) -->
       <div id="empty-state" class="empty-state">
           <h1 class="orbit-title">ORBIT</h1>
           <p class="orbit-subtitle">Describe the task in your own words. I'll route it to the right specialist agent, or spawn a new one just for you.</p>
       </div>
    </div>

    <div class="model-bar">
      <span class="model-chip" id="provider-chip">loading…</span>
      <select id="model-select" class="model-select" aria-label="Model"></select>
    </div>

    <div class="input-container">
      <div id="input-area">
         <span class="plus-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
         </span>
         <input
           id="user-input"
           type="text"
           placeholder="What should we tackle?"
           autocomplete="off"
         />
         <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
         </button>
      </div>
    </div>
  </main>

<script>
  const BACKEND = "http://localhost:8000";
  let currentModel = null;

  async function loadModels() {
    const chip = document.getElementById("provider-chip");
    const sel = document.getElementById("model-select");
    try {
      const resp = await fetch(`${BACKEND}/models`);
      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
      const data = await resp.json();
      chip.textContent = data.provider;
      sel.innerHTML = "";
      for (const m of data.models) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        if (m === data.model) opt.selected = true;
        sel.appendChild(opt);
      }
      currentModel = data.model;
      sel.disabled = data.models.length === 0;
    } catch (err) {
      chip.textContent = "offline";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "backend offline — model fixed";
      sel.appendChild(opt);
      sel.disabled = true;
    }
  }

  document.getElementById("model-select").addEventListener("change", (e) => {
    currentModel = e.target.value || null;
  });

  document.getElementById("user-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function addMessage(role, content, agentUsed, spawned, model) {
    const area = document.getElementById("chat-area");
    
    // Hide empty state on first message
    document.body.classList.add("chat-active");

    const div = document.createElement("div");
    div.classList.add("msg", role);

    if (role === "user") {
      div.textContent = content;
    } else {
      const meta = document.createElement("div");
      meta.classList.add("meta");

      const badge = document.createElement("span");
      badge.classList.add("badge", spawned ? "spawned" : "known");
      badge.textContent = spawned
        ? `✨ spawned: ${agentUsed}`
        : `Orbit: ${agentUsed}`;

      meta.appendChild(badge);

      if (model) {
        const tag = document.createElement("span");
        tag.classList.add("model-tag");
        tag.textContent = `· ${model}`;
        meta.appendChild(tag);
      }

      const text = document.createElement("div");
      text.classList.add("result-text");
      text.textContent = content;

      div.appendChild(meta);
      div.appendChild(text);
    }

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const btn   = document.getElementById("send-btn");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    btn.disabled = true;

    addMessage("user", message, null, false);

    // Show loading indicator
    const area = document.getElementById("chat-area");
    const loadingDiv = document.createElement("div");
    loadingDiv.classList.add("msg", "bot", "loading");
    loadingDiv.textContent = "Orbit is routing your task…";
    area.appendChild(loadingDiv);
    area.scrollTop = area.scrollHeight;

    try {
      const resp = await fetch(`${BACKEND}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, model: currentModel }),
      });

      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);

      const data = await resp.json();
      loadingDiv.remove();
      addMessage("bot", data.response, data.agent_used, data.spawned, data.model);

    } catch (err) {
      loadingDiv.remove();
      const errDiv = document.createElement("div");
      errDiv.classList.add("msg", "bot");
      errDiv.innerHTML = `<div class="meta"><span class="badge error">⚠ error</span></div><div>${err.message} — is the backend running on port 8000?</div>`;
      area.appendChild(errDiv);
    }

    btn.disabled = false;
    input.focus();
  }

  loadModels();
</script>

</body>
</html>
