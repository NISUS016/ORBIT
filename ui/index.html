<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #000000;
      border-right: 1px solid #1f1f22;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      z-index: 2;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: #a0a0a5;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      border: none;
      background: transparent;
      text-align: left;
      font-family: inherit;
    }

    .nav-item:hover, .nav-item.active {
      background: #111111;
      color: #ffffff;
    }

    .sidebar-section {
      margin-top: 32px;
    }

    .section-title {
      font-size: 10px;
      color: #55555a;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 0 14px;
      margin-bottom: 12px;
    }

    .history-item {
      font-size: 13px;
      color: #88888e;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-item:hover {
      background: #111111;
      color: #e2e8f0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: 
        linear-gradient(rgba(10, 10, 12, 0.95), rgba(10, 10, 12, 0.95)),
        url('bgactual.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .top-nav {
      height: 50px;
      border-bottom: 1px solid #111111;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .tab {
      font-size: 11px;
      color: #a0a0a5;
      font-weight: 600;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Chat Area */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 10%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      scroll-behavior: smooth;
      z-index: 1;
    }

    /* Empty State */
    .empty-state {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .orbit-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 96px;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .orbit-subtitle {
      font-size: 14px;
      color: #77777d;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Messages */
    .msg {
      max-width: 800px;
      font-size: 15px;
      line-height: 1.6;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: #1a1a1a;
      padding: 16px 20px;
      border-radius: 12px;
      color: #ffffff;
      max-width: 70%;
    }

    .msg.bot {
      align-self: flex-start;
      color: #cccccc;
      padding: 16px 0;
      max-width: 100%;
    }

    .msg.bot .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #222222;
    }

    .badge.known   { background: transparent; color: #88888e; }
    .badge.spawned { background: #1a1525; border-color: #2d243f; color: #a855f7; }
    .badge.error   { background: #3f1515; border-color: #5c1e1e; color: #f87171; }

    .msg.loading {
      color: #55555a;
      font-style: italic;
    }

    .result-text { white-space: pre-wrap; }

    /* Input Area */
    .input-container {
      padding: 24px;
      display: flex;
      justify-content: center;
      z-index: 2;
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 16px;
      transition: border-color 0.2s;
    }

    #input-area:focus-within {
      border-color: #444444;
    }

    .plus-icon {
      color: #77777d;
      display: flex;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    #user-input::placeholder {
      color: #66666e;
    }

    /* Micro UI Elements */
    .micro-ui {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #77777d;
    }

    .model-dropdown {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .icon-btn:hover {
      color: #e2e8f0;
    }

    /* Secretly make the stylized toggle node function as the send button to keep backend logic intact */
    #send-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { opacity: 0.8; }
    #send-btn:disabled { background: #333333; color: #55555a; cursor: not-allowed; }

    #send-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .chat-active .empty-state {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        New session
      </button>
      <button class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Capabilities
      </button>
      <button class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messaging
      </button>
      <button class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        Artifacts
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-title">PINNED</div>
      <div class="history-item">Hey, today I want to start...</div>
    </div>

    <div class="sidebar-section">
      <div class="section-title">SESSIONS</div>
      <div class="history-item">hackathon prep</div>
      <div class="history-item">Untitled session</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-nav">
      <div class="tab">○ NEW SESSION</div>
    </div>
    
    <div id="chat-area">
       <!-- Empty State (Orbit Title) -->
       <div id="empty-state" class="empty-state">
           <h1 class="orbit-title">ORBIT</h1>
           <p class="orbit-subtitle">Describe the task in your own words. I'll route it to the right specialist agent, or spawn a new one just for you.</p>
       </div>
    </div>

    <div class="input-container">
      <div id="input-area">
         <span class="plus-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
         </span>
         
         <input
           id="user-input"
           type="text"
           placeholder="What should we tackle?"
           autocomplete="off"
         />
         
         <div class="micro-ui">
            <div class="model-dropdown">
               Glm 5.2 - Low 
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="icon-btn">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </div>
            <div class="icon-btn">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </div>
            <!-- The stylized toggle node acting as the send button -->
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path></svg>
            </button>
         </div>
      </div>
    </div>
  </main>

<script>
  const BACKEND = "http://localhost:8000";

  document.getElementById("user-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function addMessage(role, content, agentUsed, spawned) {
    const area = document.getElementById("chat-area");
    
    document.body.classList.add("chat-active");

    const div = document.createElement("div");
    div.classList.add("msg", role);

    if (role === "user") {
      div.textContent = content;
    } else {
      const meta = document.createElement("div");
      meta.classList.add("meta");

      const badge = document.createElement("span");
      badge.classList.add("badge", spawned ? "spawned" : "known");
      badge.textContent = spawned
        ? `✨ spawned: ${agentUsed}`
        : `Orbit: ${agentUsed}`;

      meta.appendChild(badge);

      const text = document.createElement("div");
      text.classList.add("result-text");
      text.textContent = content;

      div.appendChild(meta);
      div.appendChild(text);
    }

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const btn   = document.getElementById("send-btn");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    btn.disabled = true;

    addMessage("user", message, null, false);

    const area = document.getElementById("chat-area");
    const loadingDiv = document.createElement("div");
    loadingDiv.classList.add("msg", "bot", "loading");
    loadingDiv.textContent = "Orbit is routing your task…";
    area.appendChild(loadingDiv);
    area.scrollTop = area.scrollHeight;

    try {
      const resp = await fetch(`${BACKEND}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);

      const data = await resp.json();
      loadingDiv.remove();
      addMessage("bot", data.response, data.agent_used, data.spawned);

    } catch (err) {
      loadingDiv.remove();
      const errDiv = document.createElement("div");
      errDiv.classList.add("msg", "bot");
      errDiv.innerHTML = `<div class="meta"><span class="badge error">⚠ error</span></div><div>${err.message} — is the backend running on port 8000?</div>`;
      area.appendChild(errDiv);
    }

    btn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
